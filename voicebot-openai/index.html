<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bas — OpenAI Realtime testversie</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0a0a0a; color: #eee; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  h1 { color: #FF6B00; font-size: 1.4rem; }
  button { background: #FF6B00; color: #fff; border: 0; padding: 12px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  select { padding: 8px; border-radius: 6px; background: #1a1a1a; color: #eee; border: 1px solid #333; }
  #status { margin: 12px 0; color: #aaa; }
  #log { background: #1a1a1a; border-radius: 8px; padding: 12px; min-height: 200px; font-size: .9rem; white-space: pre-wrap; }
  .bas { color: #FF6B00; }
  .klant { color: #7ec8ff; }
  .tool { color: #9f9; }
  .err { color: #f77; }
</style>
</head>
<body>
<h1>Bas — OpenAI Realtime testversie</h1>
<p>Vergelijking met ElevenLabs-Bas. Zelfde prompt, zelfde kennisbank, zelfde prijs-tool.</p>
<label>Stem:
  <select id="voice">
    <option value="cedar" selected>cedar (nieuwste, man)</option>
    <option value="marin">marin (nieuwste, vrouw)</option>
    <option value="ash">ash</option>
    <option value="ballad">ballad</option>
    <option value="coral">coral</option>
    <option value="echo">echo</option>
    <option value="sage">sage</option>
    <option value="shimmer">shimmer</option>
    <option value="verse">verse</option>
    <option value="alloy">alloy</option>
  </select>
</label>
<p><button id="bel">📞 Bel Bas</button> <button id="ophang" disabled>Ophangen</button></p>
<div id="status">Klaar om te bellen.</div>
<div id="log"></div>
<audio id="audio" autoplay></audio>
<script>
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const belBtn = document.getElementById('bel');
const opBtn = document.getElementById('ophang');
let pc = null, dc = null, basRegel = null;

function log(cls, tekst) {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = tekst;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}
function setStatus(t) { statusEl.textContent = t; }

function ophangen() {
  if (dc) try { dc.close(); } catch (e) {}
  if (pc) try { pc.close(); } catch (e) {}
  pc = dc = null;
  belBtn.disabled = false;
  opBtn.disabled = true;
  setStatus('Gesprek beëindigd.');
}

async function toolsAfhandelen(calls) {
  let moetResponse = false;
  for (const item of calls) {
    const args = JSON.parse(item.arguments || '{}');
    if (item.name === 'end_call') {
      log('tool', '[tool] end_call');
      setTimeout(ophangen, 3000);
      continue;
    }
    if (item.name !== 'prijs_berekenen' && item.name !== 'kennisbank_opzoeken') continue;
    const q = new URLSearchParams(args).toString();
    const pad = item.name === 'prijs_berekenen' ? '/api/prijs?' : '/api/kennisbank?';
    log('tool', `[tool] ${item.name} ${JSON.stringify(args)}`);
    let uit;
    try {
      uit = await (await fetch(pad + q)).json();
    } catch (e) {
      uit = { error: 'tool-API niet bereikbaar' };
    }
    log('tool', `[tool] → ${JSON.stringify(uit).slice(0, 200)}`);
    dc.send(JSON.stringify({
      type: 'conversation.item.create',
      item: { type: 'function_call_output', call_id: item.call_id, output: JSON.stringify(uit) },
    }));
    moetResponse = true;
  }
  // Eén response.create voor alle tooluitkomsten samen, anders "active response"-fout
  if (moetResponse) dc.send(JSON.stringify({ type: 'response.create' }));
}

function eventAfhandelen(ev) {
  let msg;
  try { msg = JSON.parse(ev.data); } catch (e) { return; }
  if (msg.type === 'response.output_audio_transcript.delta' || msg.type === 'response.audio_transcript.delta') {
    if (!basRegel) basRegel = log('bas', 'Bas: ');
    basRegel.textContent += msg.delta;
  } else if (msg.type === 'response.done') {
    basRegel = null;
    const calls = ((msg.response && msg.response.output) || []).filter((i) => i.type === 'function_call');
    if (calls.length) toolsAfhandelen(calls);
  } else if (msg.type === 'conversation.item.input_audio_transcription.completed') {
    log('klant', 'Jij: ' + (msg.transcript || '').trim());
  } else if (msg.type === 'error') {
    log('err', '[error] ' + JSON.stringify(msg.error || msg));
  }
}

belBtn.onclick = async () => {
  belBtn.disabled = true;
  logEl.textContent = '';
  try {
    setStatus('Sessie aanmaken...');
    const voice = document.getElementById('voice').value;
    const sess = await (await fetch('/session?voice=' + voice, { method: 'POST' })).json();
    if (sess.error) throw new Error(sess.error);
    const key = sess.value || (sess.client_secret && sess.client_secret.value);
    if (!key) throw new Error('Geen ephemeral key in antwoord: ' + JSON.stringify(sess));

    setStatus('Microfoon en verbinding opzetten...');
    pc = new RTCPeerConnection();
    pc.ontrack = (e) => { document.getElementById('audio').srcObject = e.streams[0]; };
    const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    pc.addTrack(mic.getTracks()[0]);
    dc = pc.createDataChannel('oai-events');
    window._dc = dc; // testhook voor webrtc-test.js
    dc.onmessage = eventAfhandelen;
    dc.onopen = () => {
      setStatus('Verbonden, Bas neemt op...');
      dc.send(JSON.stringify({ type: 'response.create' }));
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdpRes = await fetch('https://api.openai.com/v1/realtime/calls', {
      method: 'POST',
      body: offer.sdp,
      headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/sdp' },
    });
    if (!sdpRes.ok) throw new Error('SDP-exchange faalde: ' + sdpRes.status + ' ' + (await sdpRes.text()));
    await pc.setRemoteDescription({ type: 'answer', sdp: await sdpRes.text() });
    opBtn.disabled = false;
  } catch (e) {
    log('err', '[error] ' + (e.message || e));
    setStatus('Mislukt.');
    ophangen();
  }
};
opBtn.onclick = ophangen;
</script>
</body>
</html>
